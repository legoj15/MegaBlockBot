# Access transformers of the main mod (megablockbot). One line per member, each with a comment saying why.
# Format: <public|protected|private|default>[-f|+f] <class> [<member>] # <reason>
# BodyManager asks the profile cache whether a name belongs to a player the server knows, from the cache alone. The
# cache's public lookups (get(String)) ask Mojang's service for a name they do not know, on the server thread, and
# in offline mode answer with a made-up profile for every name, so none of them can answer "known?".
public net.minecraft.server.players.GameProfileCache profilesByName
public net.minecraft.server.players.GameProfileCache$GameProfileInfo
