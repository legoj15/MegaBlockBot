org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true

# Shared by every node. Version pins (minecraft_version, neo_version, dep ranges) live only in
# versions/<node>/gradle.properties, which win over this file. Never add a copy here: it would become a
# silent fallback for a node that forgot its own pin.
mod_id=megablockbot
mod_version=0.1.0

# 26.x nodes compile on Java 25; the 1.21.x nodes override this to 21 in their own properties.
java_version=25

# Which loader a node builds for. Drives the `neoforge` / `fabric` Stonecutter constants
# (docs/platform-layer.md). A future Fabric node sets loader=fabric in its own properties.
loader=neoforge

# Whether a node builds the bot: the com.legoj15.megablockbot.game package, the navigation module, the GameTest
# run, the mixin config and the access transformer. Feeds the `bot` Stonecutter constant (`//? if bot {`). Off here;
# a node that carries the bot sets bot_enabled=true in its own properties. Never derived from the node name.
bot_enabled=false
